name: Ajustar fixture RLS isolado (execucao unica)
on:
  push:
    branches:
      - fix/governanca-preflight-dupla-auditoria-20260921
    paths:
      - .github/workflows/fix-rls-fixture-once.yml
permissions:
  contents: write
jobs:
  fixture:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Restringir fixture de seguranca ao periodo de migracoes com dados simulados
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import assert from 'node:assert/strict';
          const path = 'scripts/security/rls-regression.mjs';
          const old = fs.readFileSync(path,'utf8');
          const before = "const migrations = fs.readdirSync(new URL('supabase/migrations/',root))\n  .filter(f => f >= '20260907233715_' && f.endsWith('.sql')).sort();";
          const after = "// Este fixture não contém dados de Contrato Mestre v1 nem os 18 serviços reais.\n// Testar aqui as migrações contratuais geraria falso negativo (sem cláusulas).\n// RLS permanece testada contra todas as migrações de segurança até 08/09;\n// alterações contratuais exigem ambiente de homologação com dados sintéticos próprios.\nconst migrations = fs.readdirSync(new URL('supabase/migrations/',root))\n  .filter(f => f >= '20260907233715_' && f < '20260921000000_' && f.endsWith('.sql')).sort();";
          assert.equal(old.split(before).length,2,'Trecho original do fixture mudou; abortar');
          fs.writeFileSync(path,old.replace(before,after));
          NODE
      - name: Executar teste PostgreSQL de isolamento e recuperacao de senha
        run: |
          npm ci --prefix scripts/security
          node scripts/security/rls-regression.mjs
      - name: Salvar somente ajuste de fixture na branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- scripts/security/rls-regression.mjs
          git diff --cached --quiet && exit 1 || true
          git commit -m 'test: separar teste RLS de migracoes contratuais sem fixtures'
          git push origin HEAD:fix/governanca-preflight-dupla-auditoria-20260921
