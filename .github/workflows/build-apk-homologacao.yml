name: Build APK Homologacao Firebase

on:
  push:
    branches:
      - build/apk-homologacao-firebase
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    defaults:
      run:
        working-directory: portal-app

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: portal-app/package-lock.json

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Instalar dependencias
        run: |
          npm ci
          npm install firebase@12.18.0 --no-save

      - name: TypeScript
        run: npm run typecheck

      - name: Gerar projeto Android
        run: npx expo prebuild --platform android --clean --no-install

      - name: Gerar APK release
        run: |
          chmod +x android/gradlew
          cd android
          ./gradlew assembleRelease --no-daemon

      - name: Publicar APK
        uses: actions/upload-artifact@v4
        with:
          name: CamilaMartinsEngenharia-Homologacao-APK
          path: portal-app/android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 7
