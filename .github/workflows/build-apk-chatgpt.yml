name: Build temporary Android APK

on:
  push:
    branches:
      - chatgpt-apk-build
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      EXPO_PUBLIC_APP_ENV: homologation
      EXPO_PUBLIC_EXPECTED_SUPABASE_PROJECT_REF: nvhjcoxnzigwwbdbhkhq
      EXPO_PUBLIC_SUPABASE_URL: https://nvhjcoxnzigwwbdbhkhq.supabase.co
      EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_DZu6VbG6f2peLeqpINAC6Q_tPmaH8yt
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: portal-app/package-lock.json

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Restore stable homologation signing key
        id: homologation-key-cache
        uses: actions/cache/restore@v4
        with:
          path: ~/.android/debug.keystore
          key: camila-martins-homologation-signing-v1

      - name: Ensure stable homologation signing key
        run: |
          mkdir -p "$HOME/.android"
          if [ ! -f "$HOME/.android/debug.keystore" ]; then
            keytool -genkeypair -noprompt \
              -keystore "$HOME/.android/debug.keystore" \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -dname "CN=Camila Martins Engenharia Homologacao,O=Camila Martins Engenharia,C=BR" \
              -keyalg RSA -keysize 2048 -validity 10000
          fi

      - name: Save stable homologation signing key
        if: steps.homologation-key-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ~/.android/debug.keystore
          key: camila-martins-homologation-signing-v1

      - name: Synchronize deterministic lockfile
        working-directory: portal-app
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund

      - name: Persist synchronized lockfile on temporary branch
        run: |
          if ! git diff --quiet -- portal-app/package-lock.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add portal-app/package-lock.json
            git commit -m "chore: sync Expo/Firebase lockfile [skip ci]"
            git push origin HEAD:chatgpt-apk-build
          fi

      - name: Install deterministic dependencies
        working-directory: portal-app
        run: npm ci --no-audit --no-fund

      - name: Verify environment
        working-directory: portal-app
        run: npm run check:homologation

      - name: Verify Supabase public connectivity
        working-directory: portal-app
        run: |
          curl --fail --silent --show-error \
            -H "apikey: $EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY" \
            "$EXPO_PUBLIC_SUPABASE_URL/auth/v1/settings" > /dev/null
          echo "APROVADO: URL e chave pública do Supabase responderam corretamente."

      - name: Verify Firebase and mobile identifiers
        working-directory: portal-app
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const assert = require('node:assert/strict');
          const app = JSON.parse(fs.readFileSync('app.json', 'utf8')).expo;
          const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          const lock = JSON.parse(fs.readFileSync('package-lock.json', 'utf8'));
          const google = JSON.parse(fs.readFileSync('google-services.json', 'utf8'));
          const firebaseSource = fs.readFileSync('src/lib/firebase.ts', 'utf8');
          assert.equal(app.android.package, 'br.com.camilamartinsengenharia.app');
          assert.equal(app.ios.bundleIdentifier, 'br.com.camilamartinsengenharia.app');
          assert.equal(app.android.googleServicesFile, './google-services.json');
          assert.equal(app.version, '0.10.4');
          assert.equal(pkg.version, app.version);
          assert.equal(lock.packages[''].version, app.version);
          assert.equal(pkg.dependencies.firebase, '12.18.0');
          assert.equal(lock.packages['node_modules/firebase'].version, '12.18.0');
          assert.equal(app.android.versionCode, 3);
          assert.equal(google.project_info.project_id, 'cm-engenharia-62f61');
          assert.equal(google.project_info.project_number, '75516356862');
          assert.ok(google.client.some((entry) => entry.client_info?.android_client_info?.package_name === app.android.package));
          assert.ok(firebaseSource.includes("projectId: 'cm-engenharia-62f61'"));
          assert.ok(firebaseSource.includes("messagingSenderId: '75516356862'"));
          assert.ok(!fs.existsSync('firebase.ts'), 'firebase.ts duplicado na raiz do portal-app.');
          console.log('APROVADO: versões, lockfile, Firebase, Google Services e identificadores móveis consistentes.');
          NODE

      - name: Lint
        working-directory: portal-app
        run: npm run lint

      - name: Typecheck
        working-directory: portal-app
        run: npm run typecheck

      - name: Security regression tests
        working-directory: portal-app
        run: |
          npm run security:patch -- --check
          npm run security:test
          npm run security:audit

      - name: Expo Doctor
        working-directory: portal-app
        run: npm run doctor

      - name: Generate Android project
        working-directory: portal-app
        env:
          CI: '1'
        run: npx expo prebuild --platform android --clean

      - name: Configure Gradle memory
        working-directory: portal-app/android
        run: |
          sed -i 's/^org.gradle.jvmargs=.*/org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1024m -Dfile.encoding=UTF-8/' gradle.properties
          printf '\n' >> gradle.properties
          grep -q '^org.gradle.workers.max=' gradle.properties \
            && sed -i 's/^org.gradle.workers.max=.*/org.gradle.workers.max=2/' gradle.properties \
            || echo 'org.gradle.workers.max=2' >> gradle.properties
          grep -q '^org.gradle.parallel=' gradle.properties \
            && sed -i 's/^org.gradle.parallel=.*/org.gradle.parallel=false/' gradle.properties \
            || echo 'org.gradle.parallel=false' >> gradle.properties
          echo 'Gradle configurado com heap de 4 GiB e no máximo 2 workers.'

      - name: Build release APK
        working-directory: portal-app/android
        env:
          NODE_ENV: production
          CI: '1'
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace --info

      - name: Verify final APK
        working-directory: portal-app
        run: |
          set -euo pipefail
          APK="android/app/build/outputs/apk/release/app-release.apk"
          test -s "$APK" || { echo "ERRO: APK release ausente ou vazio."; exit 1; }

          echo "Verificando pacote e versão do APK..."
          AAPT=$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -n 1)
          test -n "$AAPT" || { echo "ERRO: aapt não encontrado."; exit 1; }
          BADGING=$($AAPT dump badging "$APK" | head -n 1)
          echo "$BADGING"
          echo "$BADGING" | grep -F "name='br.com.camilamartinsengenharia.app'" >/dev/null || { echo "ERRO: package name incorreto."; exit 1; }
          echo "$BADGING" | grep -F "versionCode='3'" >/dev/null || { echo "ERRO: versionCode incorreto."; exit 1; }
          echo "$BADGING" | grep -F "versionName='0.10.4'" >/dev/null || { echo "ERRO: versionName incorreto."; exit 1; }

          echo "Verificando assinatura criptográfica do APK..."
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)
          test -n "$APKSIGNER" || { echo "ERRO: apksigner não encontrado."; exit 1; }
          "$APKSIGNER" verify --verbose --print-certs "$APK"

          echo "Verificando bundle de execução incluído no APK..."
          BUNDLE_PATH=$(unzip -Z1 "$APK" | grep 'index.android.bundle$' | head -n 1 || true)
          test -n "$BUNDLE_PATH" || { echo "ERRO: index.android.bundle não encontrado dentro do APK."; exit 1; }
          unzip -p "$APK" "$BUNDLE_PATH" > /tmp/index.android.bundle
          test -s /tmp/index.android.bundle || { echo "ERRO: bundle Android incluído no APK está vazio."; exit 1; }

          BUNDLE_BYTES=$(wc -c < /tmp/index.android.bundle)
          echo "Bundle final encontrado: $BUNDLE_PATH ($BUNDLE_BYTES bytes)."

          # Expo/React Native release usa Hermes; o bundle final pode ser bytecode e
          # não deve ser validado por procura de strings UTF-8. As configurações de
          # Supabase/Firebase já foram validadas antes da compilação e são injetadas
          # no mesmo build. Aqui validamos o artefato realmente instalável: metadados,
          # assinatura e presença do bundle executável não vazio.
          echo "APROVADO: APK final 0.10.4 possui pacote/versão corretos, assinatura válida e bundle de execução não vazio."

      - name: Collect APK
        run: |
          mkdir -p artifact
          cp portal-app/android/app/build/outputs/apk/release/app-release.apk artifact/Camila-Martins-Engenharia-0.10.4.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Camila-Martins-Engenharia-APK-0.10.4
          path: artifact/Camila-Martins-Engenharia-0.10.4.apk
          if-no-files-found: error
          retention-days: 3

# Temporary homologation build workflow; does not modify the main branch or public site.
