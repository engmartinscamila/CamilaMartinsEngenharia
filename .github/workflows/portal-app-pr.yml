name: Validação portal-app

on:
  push:
    branches:
      - main
    paths:
      - 'portal-app/**'
      - '.github/workflows/portal-app-pr.yml'
  pull_request:
    paths:
      - 'portal-app/**'
      - '.github/workflows/portal-app-pr.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: portal-app-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validar:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: portal-app

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node
        uses: actions/setup-node@v4
        with:
          node-version-file: portal-app/.node-version
          cache: npm
          cache-dependency-path: portal-app/package-lock.json

      - name: Instalar dependências
        run: npm ci

      - name: TypeScript
        run: npm run typecheck

      - name: Regressões de integração
        run: npm run test:integration

      - name: Testar busca tolerante de serviços sem auto seleção
        run: node scripts/test-commercial-service-match.mjs

      - name: Confirmar catálogo central no fluxo comercial
        run: node scripts/test-commercial-catalog-source.mjs

      - name: Testar nível Bronze Prata Ouro por serviço
        run: node scripts/test-commercial-service-levels.mjs

      - name: Testar carregamento completo de clientes, documentos e vínculos
        run: node scripts/test-construction-schedule-pagination.mjs

      - name: Testar quantitativos e custos de execução com totais consistentes
        run: node scripts/test-construction-budget-validation.mjs

      - name: Testar motor de cronograma físico-financeiro
        run: node scripts/test-construction-schedule-engine.mjs

      - name: Testar caminho crítico, folga e feriados
        run: node scripts/test-construction-schedule-critical-path.mjs

      - name: Testar Gantt sanitizado do cliente
        run: node scripts/test-construction-schedule-client-gantt.mjs

      - name: Testar métricas e Curva S com medições históricas
        run: node scripts/test-construction-schedule-progress.mjs

      - name: Testar exportação Excel do cronograma aprovado
        run: node scripts/test-construction-schedule-excel.mjs

      - name: Instalar gerador Excel somente no ambiente isolado de teste
        run: npm install --prefix "$RUNNER_TEMP/schedule-xlsx-test" --no-save --package-lock=false --ignore-scripts exceljs@4.4.0 pngjs@7.0.0

      - name: Gerar e reabrir arquivo XLSX real com dados sintéticos
        run: node scripts/test-construction-schedule-xlsx-runtime.mjs

      - name: Testar navegação com projeto e aliases
        run: node scripts/test-admin-navigation-context.mjs

      - name: Testar integridade do extrato e priorização das cobranças
        run: node scripts/test-financial-model.mjs

      - name: Testar motor SQL de pagamentos em PostgreSQL isolado
        run: |
          npm install --prefix "$RUNNER_TEMP/finance-v2-test" --no-save --ignore-scripts --no-audit @electric-sql/pglite@0.3.10
          CME_FIN_SQL_ROOT="$RUNNER_TEMP/finance-v2-test" node scripts/test-financial-v2-sql.mjs
          CME_FIN_SQL_ROOT="$RUNNER_TEMP/finance-v2-test" node scripts/test-fin-v2-receipt-sql.mjs
          CME_FIN_SQL_ROOT="$RUNNER_TEMP/finance-v2-test" node scripts/test-financial-origin-sql.mjs

      - name: Testar a interface financeira com dados sintéticos
        run: |
          npm install --prefix "$RUNNER_TEMP/financial-ui-test" --no-save --package-lock=false --ignore-scripts react@19.2.3 react-test-renderer@19.2.3
          CME_FINANCIAL_TEST_ROOT="$RUNNER_TEMP/financial-ui-test" node scripts/test-financial-ui.mjs
          CME_FINANCIAL_TEST_ROOT="$RUNNER_TEMP/financial-ui-test" node scripts/test-fin-v2-receipt-ui.mjs

      - name: ESLint
        run: npm run lint

      - name: Testes de patches de segurança
        run: npm run security:test

      - name: Auditoria completa de dependências
        run: npm run security:audit

      - name: Verificar CAPTCHA real de produção
        env:
          EXPO_PUBLIC_SUPABASE_URL: https://hghtwlopqztfcosfxafd.supabase.co
          EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_-unXLR2NSSACLs01Sr60GA_uCFnJ74f
          EXPO_PUBLIC_TURNSTILE_SITE_KEY: ${{ vars.TURNSTILE_SITE_KEY }}
        run: node scripts/verify-live-captcha.mjs

      - name: Exportação web de produção
        env:
          EXPO_PUBLIC_SUPABASE_URL: https://hghtwlopqztfcosfxafd.supabase.co
          EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_-unXLR2NSSACLs01Sr60GA_uCFnJ74f
          EXPO_PUBLIC_EXPECTED_SUPABASE_PROJECT_REF: hghtwlopqztfcosfxafd
          EXPO_PUBLIC_APP_ENV: production
          EXPO_PUBLIC_TURNSTILE_SITE_KEY: ${{ vars.TURNSTILE_SITE_KEY }}
        run: npm run check:production:cloudflare && npm run export:web

      - name: Validar exportação web
        run: npm run verify:web-export
