name: Alinhar validacao de pacotes no aplicativo (execucao unica)
on:
  push:
    branches:
      - fix/governanca-preflight-dupla-auditoria-20260921
    paths:
      - .github/workflows/fix-mobile-tier-validation-once.yml
permissions:
  contents: write
jobs:
  validate-tier:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Alinhar validacao do formulario com trigger existente sem niveis hardcoded
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import assert from 'node:assert/strict';
          const path='portal-app/src/app/admin/commercial-documents.tsx';
          let src=fs.readFileSync(path,'utf8');
          const before="    if (!selectedCodes.length && !form.customService.trim()) { setError('Selecione ao menos um serviço ou descreva um serviço personalizado.'); return; }\n    setLoadingKey('create');";
          const after="    if (!selectedCodes.length && !form.customService.trim()) { setError('Selecione ao menos um serviço ou descreva um serviço personalizado.'); return; }\n    if (!form.experienceLevel.trim()) { setError('Selecione o nível de prestação cadastrado para os serviços escolhidos.'); return; }\n    setLoadingKey('create');";
          assert.equal(src.split(before).length,2,'Trecho de validacao alterado; abortar sem alterar arquivos');
          src=src.replace(before,after);
          const labelBefore='<Field label="Nível de experiência (Bronze / Prata / Ouro)" value={form.experienceLevel} onChangeText={(value) => update(\'experienceLevel\', value)} />';
          const labelAfter='<Field label="Nível de prestação (código ativo no catálogo) *" value={form.experienceLevel} onChangeText={(value) => update(\'experienceLevel\', value)} />';
          assert.equal(src.split(labelBefore).length,2,'Campo do nivel mudou; abortar');
          src=src.replace(labelBefore,labelAfter);
          assert(src.includes("if (!form.experienceLevel.trim())"),'Validação antecipada ausente');
          assert(!src.includes('Nível de experiência (Bronze / Prata / Ouro)'),'Rotulo antigo persistiu');
          fs.writeFileSync(path,src);
          NODE
      - name: Compilar o aplicativo e executar regressao de governanca e DOCX
        run: |
          npm ci --prefix portal-app
          npm run typecheck --prefix portal-app
          npm install --no-save --prefix portal-app docx@9.5.1 jszip@3.10.1
          node --experimental-strip-types scripts/commercial-word-regression.mjs
          node scripts/document-governance-audit.mjs
      - name: Commit somente na pagina de orcamentos do aplicativo
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- portal-app/src/app/admin/commercial-documents.tsx
          git diff --cached --quiet && exit 1 || true
          git commit -m 'fix: validar nivel obrigatorio no app antes do banco'
          git push origin HEAD:fix/governanca-preflight-dupla-auditoria-20260921
