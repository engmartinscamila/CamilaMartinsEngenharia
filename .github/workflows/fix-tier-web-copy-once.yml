name: Corrigir orientacao de pacotes avulsos na web (execucao unica)
on:
  push:
    branches:
      - fix/governanca-preflight-dupla-auditoria-20260921
    paths:
      - .github/workflows/fix-tier-web-copy-once.yml
permissions:
  contents: write
jobs:
  fix-copy:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Substituir apenas mensagens verificadas na interface
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import assert from 'node:assert/strict';
          const path='js/commercial-documents-web.js';
          let source=fs.readFileSync(path,'utf8');
          const replacements=[
            ['Selecione um nível apenas para serviços de projeto elegíveis. Projetos complementares, aprovações, visitas e execução permanecem independentes.','Os níveis Bronze, Prata e Ouro também se aplicam aos serviços avulsos. O pacote limita-se à atividade selecionada e às condições expressas no orçamento e no Anexo I.'],
            ['O nível selecionado será aplicado somente aos serviços elegíveis e não incluirá serviços técnicos que não tenham sido marcados.','Selecione um nível ativo no catálogo. O pacote não acrescenta serviços, entregáveis ou formatos não descritos na proposta e no Anexo I.'],
            ['Serviço independente de nível','Consulte o nível no catálogo atualizado']
          ];
          for(const [before,after] of replacements){assert.equal(source.split(before).length,2,`Mensagem original alterada: ${before}`);source=source.replace(before,after);}
          assert(!source.includes('Selecione um nível apenas para serviços de projeto elegíveis'),'Regra antiga ainda visível');
          assert(source.includes('Os níveis Bronze, Prata e Ouro também se aplicam aos serviços avulsos.'),'Regra nova ausente');
          fs.writeFileSync(path,source);
          NODE
      - name: Validar sintaxe, links internos e governanca
        run: |
          node scripts/build-frases-do-dia-v7.mjs
          node --check js/commercial-documents-web.js
          node scripts/site-audit.mjs
          node scripts/admin-functional-audit.mjs
          node scripts/document-governance-audit.mjs
      - name: Commit limitado ao script de orcamento web
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- js/commercial-documents-web.js
          git diff --cached --quiet && exit 1 || true
          git commit -m 'fix: orientar niveis para avulsos na interface de orcamentos'
          git push origin HEAD:fix/governanca-preflight-dupla-auditoria-20260921
