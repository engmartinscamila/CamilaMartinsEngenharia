name: Conferir revisoes antes da aprovacao (execucao unica)
on:
  push:
    branches:
      - fix/governanca-preflight-dupla-auditoria-20260921
    paths:
      - .github/workflows/fix-governance-review-preview-once.yml
permissions:
  contents: write
jobs:
  preview-review:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Aplicar correcao isolada
        run: python3 scripts/fix-governance-preview-once.py
      - name: Dupla verificacao de sintaxe e regressao
        run: |
          node scripts/build-frases-do-dia-v7.mjs
          node --check js/configuracoes.js
          node scripts/governance-review-preview-regression.mjs
          node scripts/site-audit.mjs
          node scripts/admin-functional-audit.mjs
          node scripts/document-governance-audit.mjs
          node scripts/document-generation-audit.mjs
          node scripts/commercial-custom-scope-regression.mjs
      - name: Commit apenas na tela de configuracoes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- js/configuracoes.js
          git diff --cached --quiet && exit 1 || true
          git commit -m 'fix: mostrar textos e clausulas antes de confirmar revisao'
          git push origin HEAD:fix/governanca-preflight-dupla-auditoria-20260921
