name: Regressão de orçamentos e contratos

on:
  push:
    branches: [main]
    paths:
      - 'supabase/functions/generate-commercial-document/**'
      - 'portal-app/supabase/functions/generate-commercial-document/**'
      - 'supabase/functions/generate-commercial-document-final/**'
      - 'supabase/functions/generate-contract-document/**'
      - 'portal-app/supabase/functions/generate-contract-document/**'
      - 'portal-app/supabase/functions/generate-contract-document-final/**'
      - 'portal-app/src/services/commercial-service.ts'
      - 'portal-app/src/services/document-workflow-service.ts'
      - 'portal-app/src/app/admin/commercial-documents.tsx'
      - 'portal-app/src/app/admin/contract-documents.tsx'
      - 'portal-app/src/app/admin/service-level-governance.tsx'
      - 'supabase/migrations/**service_level**.sql'
      - 'supabase/migrations/**commercial**.sql'
      - 'supabase/migrations/**contract_master**.sql'
      - 'supabase/migrations/**document_chain**.sql'
      - 'js/document-function-routing-web.js'
      - 'scripts/commercial-word-regression.mjs'
      - 'scripts/finalization-word-regression.mjs'
      - 'scripts/finalization-regression.mjs'
      - 'scripts/commercial-generator-preflight-regression.mjs'
      - 'scripts/commercial-custom-scope-regression.mjs'
      - '.github/workflows/commercial-documents.yml'
  pull_request:
    branches: [main]
    paths:
      - 'supabase/functions/generate-commercial-document/**'
      - 'portal-app/supabase/functions/generate-commercial-document/**'
      - 'supabase/functions/generate-commercial-document-final/**'
      - 'supabase/functions/generate-contract-document/**'
      - 'portal-app/supabase/functions/generate-contract-document/**'
      - 'portal-app/supabase/functions/generate-contract-document-final/**'
      - 'portal-app/src/services/commercial-service.ts'
      - 'portal-app/src/services/document-workflow-service.ts'
      - 'portal-app/src/app/admin/commercial-documents.tsx'
      - 'portal-app/src/app/admin/contract-documents.tsx'
      - 'portal-app/src/app/admin/service-level-governance.tsx'
      - 'supabase/migrations/**service_level**.sql'
      - 'supabase/migrations/**commercial**.sql'
      - 'supabase/migrations/**contract_master**.sql'
      - 'supabase/migrations/**document_chain**.sql'
      - 'js/document-function-routing-web.js'
      - 'scripts/commercial-word-regression.mjs'
      - 'scripts/finalization-word-regression.mjs'
      - 'scripts/finalization-regression.mjs'
      - 'scripts/commercial-generator-preflight-regression.mjs'
      - 'scripts/commercial-custom-scope-regression.mjs'
      - '.github/workflows/commercial-documents.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  document-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verificar sintaxe do roteamento web
        run: node --check js/document-function-routing-web.js
      - name: Conferir validação antes de criar documento e sincronismo dos geradores
        run: node scripts/commercial-generator-preflight-regression.mjs
      - name: Instalar dependências travadas do aplicativo
        run: npm ci --prefix portal-app
      - name: Verificar TypeScript do aplicativo
        run: npm run typecheck --prefix portal-app
      - name: Instalar bibliotecas isoladas para os testes de documento
        run: npm install --no-save --prefix portal-app docx@9.5.1 jszip@3.10.1
      - name: Gerar DOCX de teste e validar ZIP, XML, escopo e endereços
        run: node --experimental-strip-types scripts/commercial-word-regression.mjs
      - name: Validar checkboxes OOXML e aceite exclusivo do cliente
        run: node --experimental-strip-types scripts/finalization-word-regression.mjs
      - name: Regressão estática da finalização
        run: node scripts/finalization-regression.mjs
