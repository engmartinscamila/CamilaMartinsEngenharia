name: Publicar Edge Functions no Supabase

# Publica as Edge Functions alteradas na main. Exige o segredo
# SUPABASE_ACCESS_TOKEN (Settings → Secrets and variables → Actions).
# Sem o segredo, o job termina avisando e não falha a publicação do site.
on:
  push:
    branches: [main]
    paths:
      - 'supabase/functions/**'
  workflow_dispatch:
    inputs:
      functions:
        description: 'Funções a publicar (separadas por espaço). Vazio = as alteradas no último commit.'
        required: false
        default: ''

concurrency:
  group: supabase-functions-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      PROJECT_REF: hghtwlopqztfcosfxafd
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Verificar segredo
        id: token
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::warning::SUPABASE_ACCESS_TOKEN não configurado; Edge Functions não publicadas."
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Listar funções
        if: steps.token.outputs.ok == 'true'
        id: list
        run: |
          set -euo pipefail
          if [ -n "${{ github.event.inputs.functions }}" ]; then
            names="${{ github.event.inputs.functions }}"
          else
            names=$(git diff --name-only HEAD~1 HEAD -- supabase/functions \
              | awk -F/ 'NF>3 && $3 !~ /^_/ {print $3}' | sort -u | tr '\n' ' ')
            # Mudança em _shared publica todas as funções que a importam.
            if git diff --name-only HEAD~1 HEAD -- supabase/functions/_shared | grep -q .; then
              shared=$(grep -rl "_shared/" supabase/functions --include=index.ts | awk -F/ '{print $3}' | sort -u | tr '\n' ' ')
              names="$names $shared"
            fi
          fi
          # O job assíncrono embute cópias geradas dos geradores e do _shared.
          if echo " $names " | grep -qE ' (generate-commercial-document|generate-commercial-document-final|generate-contract-document|deliver-generated-document) ' \
             || git diff --name-only HEAD~1 HEAD -- supabase/functions/_shared | grep -q .; then
            names="$names process-commercial-document-job"
          fi
          names=$(echo $names | tr ' ' '\n' | sort -u | tr '\n' ' ')
          echo "names=$names" >> "$GITHUB_OUTPUT"
          echo "Funções: $names"

      - uses: supabase/setup-cli@v1
        if: steps.token.outputs.ok == 'true' && steps.list.outputs.names != ''
        with:
          version: latest

      - name: Publicar
        if: steps.token.outputs.ok == 'true' && steps.list.outputs.names != ''
        run: |
          set -euo pipefail
          node scripts/build-commercial-document-job.mjs
          # Funções que hoje rodam sem verificação de JWT (fazem a própria autenticação).
          # Mantê-las assim evita quebrar webhooks, cron e links públicos.
          no_jwt=" proteger-pdf agenda-ics prospect-document-access cleanup-expired-assets client-password-link dispatch-document-notifications dispatch-client-emails process-commercial-document-job "
          for fn in ${{ steps.list.outputs.names }}; do
            [ -f "supabase/functions/$fn/index.ts" ] || { echo "Ignorando $fn (sem index.ts)"; continue; }
            flags="--project-ref $PROJECT_REF --use-api"
            case "$no_jwt" in *" $fn "*) flags="$flags --no-verify-jwt";; esac
            echo "Publicando $fn ($flags)"
            supabase functions deploy "$fn" $flags
          done
