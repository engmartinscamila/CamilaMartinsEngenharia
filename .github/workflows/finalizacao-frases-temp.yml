name: Gerar acervo de frases da finalização

on:
  push:
    branches:
      - finalizacao-definitiva-2026-09-24

permissions:
  contents: write

jobs:
  gerar:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: finalizacao-definitiva-2026-09-24
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Reconstruir acervo multi-autor
        run: node scripts/build-frases-do-dia-v7.mjs
      - name: Validar e versionar acervo
        shell: bash
        run: |
          node -e "const f=require('./assets/frases-do-dia.json'); if(!Array.isArray(f.frases)||f.frases.length<700) process.exit(1); const a=new Set(f.frases.map(x=>x.autor)); if(a.size<8||!a.has('Camila Martins')) process.exit(1); console.log(f.frases.length,a.size)"
          if git diff --quiet -- assets/frases-do-dia.json; then
            echo "Acervo já estava atualizado."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/frases-do-dia.json
          git commit -m "Atualizar acervo multi-autor de frases"
          git push origin HEAD:finalizacao-definitiva-2026-09-24
