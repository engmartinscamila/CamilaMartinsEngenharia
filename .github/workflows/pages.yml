name: Deploy static site to Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  auditoria:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Gerar acervo de frases do dia
        run: node scripts/build-frases-do-dia-v7.mjs

      - name: Auditoria estática e funcional do Admin
        run: |
          node scripts/site-audit.mjs
          node scripts/admin-functional-audit.mjs
          node scripts/document-generation-audit.mjs

      - name: Verificar segurança antes de publicar
        run: |
          node scripts/security/secret-scan.mjs
          npm ci --prefix scripts/security
          node scripts/security/rls-regression.mjs
          node scripts/security/ofx-regression.mjs

      - name: Preparar versão pública protegida
        run: bash scripts/prepare-site-public.sh

      - name: Auditar pacote final de publicação
        run: node scripts/site-public-audit.mjs

      - name: Instalar Chromium de teste
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Servir site local
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 --directory site-public > /tmp/cme-http.log 2>&1 &
          echo $! > /tmp/cme-http.pid
          sleep 2
          curl --fail http://127.0.0.1:4173/admin.html >/dev/null
          curl --fail http://127.0.0.1:4173/integridade-sistema.html >/dev/null
          curl --fail http://127.0.0.1:4173/portal.html >/dev/null

      - name: Testes de interface desktop e mobile
        run: |
          node scripts/browser-smoke.mjs
          node scripts/mobile-admin-smoke.mjs

      - name: Log do servidor em caso de falha
        if: failure()
        run: cat /tmp/cme-http.log || true

  deploy:
    needs: auditoria
    if: ${{ needs.auditoria.result == 'success' }}

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Gerar acervo de frases do dia
        run: node scripts/build-frases-do-dia-v7.mjs

      - name: Prepare protected classic website
        run: bash scripts/prepare-site-public.sh

      - name: Instalar portal integrado
        working-directory: portal-app
        run: npm ci

      - name: Validar e exportar portal integrado
        working-directory: portal-app
        env:
          EXPO_PUBLIC_SUPABASE_URL: https://hghtwlopqztfcosfxafd.supabase.co
          EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_-unXLR2NSSACLs01Sr60GA_uCFnJ74f
          EXPO_PUBLIC_EXPECTED_SUPABASE_PROJECT_REF: hghtwlopqztfcosfxafd
          EXPO_PUBLIC_APP_ENV: production
        run: npm run check:production:cloudflare && npm run typecheck && npm run lint && npm run security:audit && npm run export:web && npm run verify:web-export

      - name: Integrar portal ao domínio
        run: |
          mkdir -p site-public/portal
          cp -R portal-app/dist/. site-public/portal/
          find portal-app/dist -type f -name '*.html' ! -name 'index.html' -print0 | while IFS= read -r -d '' source; do
            route="${source#portal-app/dist/}"
            route="${route%.html}"
            mkdir -p "site-public/portal/${route}"
            cp "$source" "site-public/portal/${route}/index.html"
          done

      - name: Testar rotas reais do Admin integrado
        run: |
          set -euo pipefail
          routes=(
            crm
            contract-documents
            document-preparation
            document-governance
            document-archive
            tasks
            work-diary
            procurement
            financial
            portal-control
            construction-schedule
            approvals
            notifications
            security
          )
          if grep -q 'portal/admin/index.html?section=' site-public/js/ui-core.js; then
            echo 'ERRO: o pacote publicado ainda contém a rota-ponte quebrada ?section=.' >&2
            exit 1
          fi
          python3 -m http.server 4174 --bind 127.0.0.1 --directory site-public > /tmp/cme-integrated-http.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          sleep 2
          for route in "${routes[@]}"; do
            test -f "site-public/portal/admin/${route}.html"
            test -f "site-public/portal/admin/${route}/index.html"
            curl --fail --silent --show-error "http://127.0.0.1:4174/portal/admin/${route}.html" > /tmp/cme-route.html
            if grep -q 'Página não encontrada' /tmp/cme-route.html; then
              echo "ERRO: /portal/admin/${route}.html devolveu página não encontrada." >&2
              exit 1
            fi
            echo "OK /portal/admin/${route}.html"
          done

      - name: Instalar Chromium para teste real de cliques
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Testar cliques reais da navegação Admin
        env:
          SITE_BASE: http://127.0.0.1:4174
        run: |
          set -euo pipefail
          python3 -m http.server 4174 --bind 127.0.0.1 --directory site-public > /tmp/cme-click-http.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          sleep 2
          node scripts/admin-click-navigation-smoke.mjs

      - name: Revalidar pacote final
        run: |
          node scripts/site-public-audit.mjs
          node scripts/admin-functional-audit.mjs
          node scripts/document-generation-audit.mjs

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload classic site
        uses: actions/upload-pages-artifact@v3
        with:
          path: "site-public"

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
