name: Deploy static site to Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare classic website
        shell: bash
        run: |
          set -euo pipefail
          rm -rf site-public
          mkdir -p site-public

          find . -maxdepth 1 -type f -name '*.html' -exec cp {} site-public/ \;
          cp -R assets site-public/assets
          cp -R css site-public/css
          cp -R js site-public/js
          touch site-public/.nojekyll
          printf '%s\n' "${GITHUB_SHA}" > site-public/build-version.txt

          for file in CNAME robots.txt sitemap.xml camila-martins.vcf; do
            if [[ -f "$file" ]]; then
              cp "$file" site-public/
            fi
          done

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload classic site
        uses: actions/upload-pages-artifact@v3
        with:
          path: "site-public"

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
