name: Deploy static site to Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  auditoria:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Auditoria estática
        run: node scripts/site-audit.mjs

      - name: Preparar versão pública protegida
        run: bash scripts/prepare-site-public.sh

      - name: Instalar Chromium de teste
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Servir site local
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 --directory site-public > /tmp/cme-http.log 2>&1 &
          echo $! > /tmp/cme-http.pid
          sleep 2
          curl --fail http://127.0.0.1:4173/admin.html >/dev/null

      - name: Testes de interface
        run: node scripts/browser-smoke.mjs

      - name: Log do servidor em caso de falha
        if: failure()
        run: cat /tmp/cme-http.log || true

  deploy:
    needs: auditoria
    if: ${{ needs.auditoria.result == 'success' }}

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Prepare protected classic website
        run: bash scripts/prepare-site-public.sh

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload classic site
        uses: actions/upload-pages-artifact@v3
        with:
          path: "site-public"

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
