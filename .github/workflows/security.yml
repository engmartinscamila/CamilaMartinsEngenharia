name: Segurança do repositório

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  security:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Examinar segredos no histórico sem revelar valores
        run: node scripts/security/secret-scan.mjs

      - name: Instalar ambiente isolado de testes SQL
        run: npm ci --prefix scripts/security

      - name: Testar isolamento real das policies em PostgreSQL
        run: node scripts/security/rls-regression.mjs

      - name: Bloquear arquivos de ambiente reais
        shell: bash
        run: |
          set -euo pipefail
          bad_env="$(git ls-files | grep -E '(^|/)\.env($|\.)' | grep -Ev '(^|/)\.env(\.[A-Za-z0-9_-]+)?\.example$' || true)"
          if [ -n "$bad_env" ]; then
            echo "Arquivos .env reais não podem ser versionados:"
            echo "$bad_env"
            exit 1
          fi

      - name: Exigir migrations críticas de isolamento
        shell: bash
        run: |
          set -euo pipefail
          test -f supabase/migrations/20260907225919_close_cross_tenant_visibility_policies.sql
          test -f supabase/migrations/20260907230437_explicitly_deny_password_rate_limit_api.sql

      - name: Validar autenticação administrativa no servidor
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'rpc("is_portal_admin")' js/auth.js
          if grep -q 'session\.user\.id !== window\.ADMIN_UID' js/auth.js; then
            echo "A autorização administrativa voltou a depender do frontend."
            exit 1
          fi
