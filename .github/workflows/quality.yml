name: Auditoria completa do portal

on:
  push:
    branches:
      - auditoria-geral-20260829
      - auditoria-estrutural-20260829
      - galeria-fotos-20260829
      - verificacao-r2-pos-migracao-20260830
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: auditoria-${{ github.ref }}
  cancel-in-progress: true

jobs:
  auditoria:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Auditoria estática
        run: node scripts/site-audit.mjs

      - name: Instalar Chromium de teste
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Servir site local
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 > /tmp/cme-http.log 2>&1 &
          echo $! > /tmp/cme-http.pid
          sleep 2
          curl --fail http://127.0.0.1:4173/admin.html >/dev/null

      - name: Testes de interface
        run: node scripts/browser-smoke.mjs

      - name: Testar Worker público Cloudflare
        if: github.ref_name == 'galeria-fotos-20260829'
        run: |
          set -euo pipefail
          BASE="https://cme-public-media.eng-martins-camila.workers.dev"

          echo "== /health =="
          curl --fail --show-error --silent --retry 3 "$BASE/health" -o /tmp/cme-health.json
          cat /tmp/cme-health.json
          node -e "const fs=require('fs');const d=JSON.parse(fs.readFileSync('/tmp/cme-health.json','utf8'));if(!(d.ok===true&&d.service==='cme-public-media'&&d.storage==='cloudflare-r2'&&d.catalog==='github')){console.error(d);process.exit(1)}"

          echo
          echo "== /api/manifest =="
          CODE=$(curl --show-error --silent --retry 1 -w "%{http_code}" "$BASE/api/manifest" -o /tmp/cme-manifest.json)
          echo "HTTP $CODE"
          cat /tmp/cme-manifest.json
          echo
          test "$CODE" = "200"
          node -e "const fs=require('fs');const d=JSON.parse(fs.readFileSync('/tmp/cme-manifest.json','utf8'));if(!Array.isArray(d.projetos)||!d.projetos.length){console.error(d);process.exit(1)};console.log('projetos:',d.projetos.length);console.log('primeiro:',d.projetos[0]?.nome||d.projetos[0]?.slug||'sem nome')"

      - name: Verificar todas as mídias migradas no R2
        if: github.ref_name == 'verificacao-r2-pos-migracao-20260830'
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('fs');
          const https = require('https');

          const manifest = JSON.parse(fs.readFileSync('assets/projetos/galeria.json','utf8'));
          const refs = [];
          for (const p of manifest.projetos || []) {
            for (const img of p.imagens || []) {
              if (img.src) refs.push({kind:'image', url:img.src, path:img.storagePath || ''});
            }
            for (const v of p.videos || []) {
              if (v.src) refs.push({kind:'video', url:v.src, path:v.storagePath || ''});
              if (v.poster) refs.push({kind:'poster', url:v.poster, path:v.posterStoragePath || ''});
            }
          }

          if (refs.length !== 81) {
            throw new Error('Esperado 81 referências de mídia, encontrado ' + refs.length);
          }

          const workerPrefix = 'https://cme-public-media.eng-martins-camila.workers.dev/media/';
          for (const item of refs) {
            if (!item.url.startsWith(workerPrefix)) {
              throw new Error('URL fora do R2/Worker: ' + item.url);
            }
            if (!item.path.startsWith('portfolio/')) {
              throw new Error('storagePath inválido: ' + item.path);
            }
          }

          function fetchRange(item) {
            return new Promise((resolve, reject) => {
              const req = https.get(item.url, {
                headers: { Range: 'bytes=0-0', 'User-Agent':'cme-r2-audit' }
              }, res => {
                let body = Buffer.alloc(0);
                res.on('data', chunk => {
                  if (body.length < 4096) body = Buffer.concat([body, chunk]).subarray(0,4096);
                });
                res.on('end', () => {
                  resolve({
                    status: res.statusCode,
                    type: String(res.headers['content-type'] || ''),
                    length: String(res.headers['content-length'] || ''),
                    range: String(res.headers['content-range'] || ''),
                    body: body.toString('utf8',0,512)
                  });
                });
              });
              req.on('error', reject);
              req.setTimeout(20000, () => req.destroy(new Error('timeout')));
            });
          }

          (async()=>{
            const failures=[];
            const stats={200:0,206:0,other:0,image:0,video:0,poster:0};
            for (let i=0;i<refs.length;i++) {
              const item=refs[i];
              const r=await fetchRange(item);
              if (r.status === 200) stats[200]++;
              else if (r.status === 206) stats[206]++;
              else stats.other++;
              stats[item.kind]++;

              const typeOk = item.kind === 'video'
                ? r.type.startsWith('video/')
                : r.type.startsWith('image/');
              if (!([200,206].includes(r.status)) || !typeOk) {
                failures.push({index:i+1,kind:item.kind,url:item.url,status:r.status,type:r.type,range:r.range,body:r.body});
              }
            }

            console.log('TOTAL', refs.length);
            console.log('STATS', JSON.stringify(stats));
            if (failures.length) {
              console.error('FALHAS', JSON.stringify(failures,null,2));
              process.exit(1);
            }
            console.log('TODAS_AS_MIDIAS_OK');
          })().catch(err=>{console.error(err);process.exit(1)});
          NODE

          echo "== health =="
          curl --fail --silent --show-error "https://cme-public-media.eng-martins-camila.workers.dev/health"

          echo
          echo "== manifest remoto =="
          curl --fail --silent --show-error "https://cme-public-media.eng-martins-camila.workers.dev/api/manifest" -o /tmp/manifest-r2.json
          node - <<'NODE'
          const fs=require('fs');
          const local=JSON.parse(fs.readFileSync('assets/projetos/galeria.json','utf8'));
          const remote=JSON.parse(fs.readFileSync('/tmp/manifest-r2.json','utf8'));
          const norm=o=>JSON.stringify(o);
          if(norm(local)!==norm(remote)){
            console.error('Manifesto remoto diverge do GitHub');
            process.exit(1);
          }
          console.log('MANIFESTO_REMOTO_IGUAL_GITHUB');
          NODE

      - name: Log do servidor em caso de falha
        if: failure()
        run: cat /tmp/cme-http.log || true
