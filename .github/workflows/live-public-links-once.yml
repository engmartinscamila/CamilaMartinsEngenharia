name: Teste passivo de links publicados (execucao unica)
on:
  push:
    branches:
      - fix/governanca-preflight-dupla-auditoria-20260921
    paths:
      - .github/workflows/live-public-links-once.yml
permissions:
  contents: read
jobs:
  public-links:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Conferir URLs reais sem autenticar ou enviar dados
        run: |
          set -euo pipefail
          base='https://camilamartinsengenharia.com.br'
          for path in '/' '/login.html' '/galeria-projetos.html' '/pdf-protegido.html?slug=portfolio' '/orcamentos-contratos.html' '/documentos-contratuais.html' '/arquivo-documental.html' '/portal.html' '/admin.html' '/assets/logo.png' '/js/commercial-documents-web.js'; do
            code=$(curl --location --retry 1 --retry-all-errors --max-time 18 --silent --show-error --output /dev/null --write-out '%{http_code}' "$base$path")
            echo "$code $path"
            case "$code" in 200|301|302|303|307|308) ;; *) echo "ERRO: rota indisponivel $path HTTP $code" >&2; exit 1;; esac
          done
      - name: Verificar ancora, rota e imagem referenciadas na pagina inicial
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import fs from 'node:fs';
          const html=fs.readFileSync('index.html','utf8');
          for(const href of ['login.html','pdf-protegido.html?slug=portfolio','galeria-projetos.html#tiny-house-signature'])assert(html.includes(href),`Link original ausente: ${href}`);
          for(const id of ['inicio','sobre','projetos-destaque','servicos','processo','contato'])assert(html.includes(`id="${id}"`),`Âncora local inexistente: ${id}`);
          console.log('PASS: destinos e ancoras publicas presentes no HTML');
          NODE
