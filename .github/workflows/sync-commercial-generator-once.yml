name: Sincronizar gerador comercial duplicado (execucao unica)
on:
  push:
    branches:
      - fix/governanca-preflight-dupla-auditoria-20260921
    paths:
      - .github/workflows/sync-commercial-generator-once.yml
permissions:
  contents: write
jobs:
  sync-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Sincronizar apenas espelho do gerador, sem tocar outros arquivos
        run: |
          test -s supabase/functions/generate-commercial-document/index.ts
          test -s portal-app/supabase/functions/generate-commercial-document/index.ts
          cp supabase/functions/generate-commercial-document/index.ts portal-app/supabase/functions/generate-commercial-document/index.ts
          cmp supabase/functions/generate-commercial-document/index.ts portal-app/supabase/functions/generate-commercial-document/index.ts
          node scripts/document-governance-audit.mjs
      - name: Testar aplicativo e documento Word real
        run: |
          npm ci --prefix portal-app
          npm run typecheck --prefix portal-app
          npm install --no-save --prefix portal-app docx@9.5.1 jszip@3.10.1
          node --experimental-strip-types scripts/commercial-word-regression.mjs
      - name: Registrar somente a copia sincronizada na branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- portal-app/supabase/functions/generate-commercial-document/index.ts
          git diff --cached --quiet && exit 1 || true
          git commit -m 'fix: sincronizar gerador comercial espelhado apos testes'
          git push origin HEAD:fix/governanca-preflight-dupla-auditoria-20260921
