name: Corrigir pacotes avulsos em branch isolada
on:
  push:
    branches:
      - fix/governanca-preflight-dupla-auditoria-20260921
    paths:
      - .github/workflows/apply-avulsos-pacotes.yml
permissions:
  contents: write
jobs:
  corrigir-e-testar:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Aplicar apenas substituições exatas e verificadas
        run: |
          node scripts/apply-avulsos-pacotes-fix.mjs
          node scripts/update-avulsos-regression.mjs
      - name: Instalar dependências e verificar aplicativo
        run: |
          npm ci --prefix portal-app
          npm run typecheck --prefix portal-app
          npm install --no-save --prefix portal-app docx@9.5.1 jszip@3.10.1
      - name: Gerar DOCX de teste e verificar integridade, escopo, legado e níveis
        run: node --experimental-strip-types scripts/commercial-word-regression.mjs
      - name: Gravar exclusivamente geradores e regressão na branch de revisão
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- supabase/functions/generate-commercial-document/index.ts supabase/functions/generate-commercial-document-final/index.ts scripts/commercial-word-regression.mjs
          git diff --cached --exit-code && exit 1 || true
          git commit -m 'fix: pacotes avulsos no orçamento e contrato com regressão DOCX'
          git push origin HEAD:fix/governanca-preflight-dupla-auditoria-20260921