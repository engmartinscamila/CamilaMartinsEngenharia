name: Teste temporario de notificacoes

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/smoke-notificacoes-temp.yml"

permissions:
  contents: read

jobs:
  testar:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Executar teste real de e-mail e SMS
        run: |
          set -euo pipefail
          curl --fail --show-error --silent             -X POST             "https://hghtwlopqztfcosfxafd.supabase.co/functions/v1/cme-smoke-notificacoes"             -H "content-type: application/json"             --data '{}'             | tee /tmp/notificacoes.json
          node -e "const fs=require('fs'); const d=JSON.parse(fs.readFileSync('/tmp/notificacoes.json','utf8')); if(!d.ok){console.error(d); process.exit(1)}; console.log('email:',d.email?.status||'n/a'); console.log('sms:',d.sms?.status||'n/a');"
