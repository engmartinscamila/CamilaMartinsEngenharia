name: Teste push Gabriel

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/smoke-push-gabriel-temp.yml"

permissions:
  contents: read

jobs:
  testar:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Enviar push real
        run: |
          set -euo pipefail
          curl --fail --show-error --silent             -X POST             "https://hghtwlopqztfcosfxafd.supabase.co/functions/v1/cme-smoke-notificacoes"             -H "content-type: application/json"             --data '{}'             | tee /tmp/push.json
          node -e "const fs=require('fs'); const d=JSON.parse(fs.readFileSync('/tmp/push.json','utf8')); console.log(d); if(!d.ok && !d.alreadyRun) process.exit(1);"
